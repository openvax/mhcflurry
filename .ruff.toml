target-version = "py310"

[lint]
# Keep the release gate focused on correctness. Formatting and modernization
# rules are intentionally not enabled: applying them to this legacy scientific
# codebase would produce a large, prediction-risking mechanical rewrite.
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "B006",
    "B023",
    "PLW1508",
    "RUF100",
]
