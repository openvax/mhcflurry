name: Documentation

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master", "release-2.3.0-final-weights"]
  workflow_dispatch:

concurrency:
  group: documentation-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # PRs and published docs both use the package's current model release.
      MHCFLURRY_DATA_DIR: ${{ github.workspace }}/.mhcflurry-data

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            docs/requirements.txt
            pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install package and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r docs/requirements.txt

      # Keyed like ci.yml: by the catalogue and this file, with no restore-keys.
      - name: Cache presentation models
        uses: actions/cache@v6
        with:
          path: .mhcflurry-data
          key: mhcflurry-docs-data-${{ runner.os }}-${{ hashFiles('mhcflurry/downloads.yml', '.github/workflows/docs.yml') }}

      - name: Download presentation models
        run: mhcflurry downloads fetch models_class1_presentation

      - name: Build documentation
        run: |
          make -C docs generate
          make -C docs html SPHINXOPTS=-W
          make -C docs doctest SPHINXOPTS=-W

      - name: Save rendered documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation-html
          path: docs/_build/html

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout archived documentation
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: archived-docs
          sparse-checkout: previous-versions

      - name: Download rendered documentation
        uses: actions/download-artifact@v8
        with:
          name: documentation-html
          path: documentation-html

      - name: Preserve archived documentation
        run: |
          cp -R archived-docs/previous-versions documentation-html/
          touch documentation-html/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: documentation-html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
