name: Docker

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'release' || !github.event.release.prerelease
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      - name: Check release identity
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c 'exec(open("mhcflurry/version.py").read()); print(__version__)')
          if [ -n "$RELEASE_TAG" ]; then
            python -c 'import re,sys; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", sys.argv[1])' "$VERSION"
            test "$VERSION" = "$RELEASE_TAG"
            gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq 'select(.isDraft == false and .isPrerelease == false)' | python -c 'import json,sys; assert json.load(sys.stdin)'
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: mhcflurry-test:local
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.version.outputs.revision }}
      - name: Test CLI and bundled weights offline
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run --rm --network none mhcflurry-test:local mhcflurry --version
          docker run --rm --network none mhcflurry-test:local mhcflurry downloads info
          docker run --rm --network none mhcflurry-test:local python /opt/mhcflurry/docker/smoke.py "$VERSION"
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish tested architecture
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          IMAGE="openvax/mhcflurry:$VERSION-$ARCH"
          docker tag mhcflurry-test:local "$IMAGE"
          docker push "$IMAGE"

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish multi-platform tags
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          IMAGE="openvax/mhcflurry:$VERSION"
          docker buildx imagetools create -t "$IMAGE" "$IMAGE-amd64" "$IMAGE-arm64"
          LATEST=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          if [ "$VERSION" = "$LATEST" ]; then
            docker buildx imagetools create -t openvax/mhcflurry:latest "$IMAGE"
          fi
          docker buildx imagetools inspect "$IMAGE"
